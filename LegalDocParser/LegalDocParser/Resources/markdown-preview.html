<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: '맑은 고딕', 'Malgun Gothic', 'Segoe UI', sans-serif;
            line-height: 1.7;
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
            color: #333;
            font-size: 14px;
        }
        h1, h2, h3, h4, h5, h6 {
            color: #1a1a1a;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.3em;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #f5f5f5;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #fafafa;
        }
        code {
            background-color: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 13px;
        }
        pre {
            background-color: #f4f4f4;
            padding: 12px;
            border-radius: 5px;
            overflow-x: auto;
        }
        pre code {
            padding: 0;
            background: none;
        }
        blockquote {
            border-left: 4px solid #2196F3;
            margin: 1em 0;
            padding: 0.5em 1em;
            background-color: #f8f9fa;
        }
        .search-highlight {
            background-color: #ffeb3b;
            padding: 1px 2px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    {{CONTENT}}
</body>
</html>
